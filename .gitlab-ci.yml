---
# GitLab CI/CD Pipeline for timeseries
# SPDX-License-Identifier: Apache-2.0

default:
  interruptible: true
  tags:
    - company
    - linux
    - x86

# Supply-chain hardening (appsec F8): ci-catalog components below are
# pinned to immutable commits. Most retain the SHA that `v1.43.0` resolved to at the time
# of pinning, rather than to the mutable tag itself. `glab ci lint` confirmed
# GitLab's component `include:` accepts a 40-char commit SHA in place of a
# semver ref.
#
#   tag v1.43.0 (gitlab.com/devnw/ci-catalog) -> commit 7dafa6b7aa3b2254b109a31c6791437c14e7ce3c
#   release-semantic: v1.55.8 -> commit 3122045afd7832332b342ca72065e4db7dde5ed4
#     Adds CI_JOB_TOKEN release publication (SONNY-4829).
#
# Drift-detection expectation: if `git ls-remote https://gitlab.com/devnw/ci-catalog.git v1.43.0`
# (peeled, i.e. `refs/tags/v1.43.0^{}`) ever reports a different commit than
# the SHA above, the tag was moved/re-pointed upstream -- treat that as a
# supply-chain integrity signal requiring investigation before bumping this
# pin to the new SHA.
include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"
  # Redirect Zig's global package cache (normally ~/.cache/zig) into the
  # project directory so the cache: block below can persist it across jobs.
  ZIG_GLOBAL_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/zig"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Cache the extracted Zig toolchain, its retained hash-verified download
# archive, and Zig's global package cache (thread_pool/otel deps) across
# all jobs. Keyed on build.zig.zon so a dependency/version bump
# invalidates it automatically.
#
# SEC-4: the cache key is not ref-scoped (see the drift-detection note
# below), so a warm cache MUST NOT be trusted without re-verification --
# see the SHA-256 check in .install-zig, which runs unconditionally on
# every job, not just on a cold-cache miss.
cache:
  key:
    files:
      - build.zig.zon
  paths:
    - zig-${ZIG_VERSION}/
    - .cache/zig/
    - .cache/zig-dl/

# Zig installation template (SEC-R6-02 / SEC-4: SHA-256 verified via the
# ziglang.org index on every job -- cold cache AND warm cache).
#
# SEC-4 (2026-07-07): a prior version of this template only verified the
# SHA-256 inside the `if [ ! -f "zig-${ZIG_VERSION}/zig" ]` guard, so a
# warm-cache run trusted the cached `zig-${ZIG_VERSION}/` directory
# without ever re-checking it. Because the `cache: key:` above is scoped
# only to `build.zig.zon`'s hash (not to `$CI_COMMIT_REF_NAME` or
# protection status), a pipeline on any branch can populate/observe the
# same cache entry -- so a warm cache is not an equivalent trust
# boundary to "downloaded and verified just now" and must not be treated
# as one.
#
# Fix: the retained artifact across cache hits is now the downloaded
# `.tar.xz` archive itself (kept in `.cache/zig-dl/`, not the extracted
# toolchain). The expected SHA-256 is re-fetched from
# `ziglang.org/download/index.json` on every single job (cheap: one
# small JSON file), and the cached archive is verified against it with
# `sha256sum --check --strict` unconditionally -- a cache hit only saves
# the network download, never the verification. The `zig-${ZIG_VERSION}/`
# toolchain directory is then unconditionally re-extracted from that
# just-verified archive on every job, so a tampered/corrupted extracted
# binary can never be used without also matching the hash-verified
# archive contents.
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    set -e
    ARCH=$(uname -m)
    case "$ARCH" in
      x86_64)  ZIG_ARCH="x86_64" ;;
      aarch64) ZIG_ARCH="aarch64" ;;
      arm64)   ZIG_ARCH="aarch64" ;;
      *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
    esac
    MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
    MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
    if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
      ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
    else
      ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
    fi
    TARBALL="${ARCHIVE_NAME}.tar.xz"
    DL_DIR=".cache/zig-dl"
    CACHED_TARBALL="${DL_DIR}/${TARBALL}"
    mkdir -p "${DL_DIR}"

    # Always re-fetch the index so EXPECTED_HASH is authoritative and
    # independent of anything sitting in the cache.
    INDEX_FILE=$(mktemp)
    curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
    EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
      python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
    rm -f "${INDEX_FILE}"

    # Download only on a genuine cache miss (missing or already-invalid
    # cached archive) -- but the verification step below always runs
    # regardless, so this guard is a speed optimization, not a trust
    # decision.
    if [ ! -f "${CACHED_TARBALL}" ] || ! echo "${EXPECTED_HASH}  ${CACHED_TARBALL}" | sha256sum --check --strict --status; then
      echo "Downloading ${TARBALL} (cache miss or stale/invalid cached archive)..."
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${CACHED_TARBALL}"
    fi

    # SEC-4: verify unconditionally -- on both cold cache (just
    # downloaded above) and warm cache (restored from a prior job) --
    # before the archive is trusted.
    echo "${EXPECTED_HASH}  ${CACHED_TARBALL}" | sha256sum --check --strict

    # Re-extract unconditionally from the just-verified archive, so a
    # cached `zig-${ZIG_VERSION}/` directory is never used as-is; its
    # contents are always regenerated from a binary we just checked.
    rm -rf "zig-${ZIG_VERSION}" "${ARCHIVE_NAME}"
    tar -xJf "${CACHED_TARBALL}"
    mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  # SUPPLY-1: pinned to a content digest (not a floating tag) so a
  # repointed/compromised upstream image can't silently run CI -- this image
  # is where SEC-4's toolchain-hash verification (curl/sha256sum) executes.
  # Refresh periodically (e.g. via Renovate) so the pin doesn't rot.
  image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
  before_script:
    - *install-zig
  script:
    - zig build check

# Shared template for the optimize-mode test matrix below. Reproduces the
# exact commands the former per-mode jobs ran: the Debug entry omits
# -Doptimize= entirely (matching Zig's default), other modes pass it explicitly.
.test-matrix:
  stage: test
  image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
  before_script:
    - *install-zig
  script:
    - |
      if [ "$ZIG_OPTIMIZE" = "Debug" ]; then
        zig build "$ZIG_BUILD_TARGET" --summary all
      else
        zig build "$ZIG_BUILD_TARGET" -Doptimize="$ZIG_OPTIMIZE" --summary all
      fi
  needs:
    - build

# Unit tests across all optimize modes (was: test, test-release-safe,
# test-release-fast, test-release-small).
test:
  extends: .test-matrix
  parallel:
    matrix:
      - ZIG_BUILD_TARGET: test
        ZIG_OPTIMIZE: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]

# Integration tests across optimize modes (was: test-integration,
# test-integration-release-safe, test-integration-release-fast).
test-integration:
  extends: .test-matrix
  parallel:
    matrix:
      - ZIG_BUILD_TARGET: test-integration
        ZIG_OPTIMIZE: [Debug, ReleaseSafe, ReleaseFast]

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# Benchmark regression detection.
# Results are stored as artifacts for trend analysis.
bench-regression:
  stage: fuzz
  image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
  before_script:
    - *install-zig
  script:
    - zig build bench -Doptimize=ReleaseFast 2>&1 | tee bench-results.txt
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  needs:
    - build

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

test-source-package:
  stage: test
  image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  tags: [company, linux, x86]
  before_script:
    - *install-zig
    - apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/check_source_package.py --jobs 2
  needs:
    - build
  allow_failure: false

workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - when: always
