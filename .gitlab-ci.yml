---
# GitLab CI/CD Pipeline for timeseries
# SPDX-License-Identifier: Apache-2.0

include:
  # Security scanning
  # S12: These component tags should be pinned to immutable commit SHAs for
  # supply-chain integrity. Requires GitLab API access to resolve tag -> SHA.
  # Current semver tags are acceptable for now; pin to SHAs when available.
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # Code quality -- zig-format@v1.2.1 replaced with local job due to URL breakage

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  ZIG_VERSION: "0.15.1"
  # S11: SHA256 of zig-x86_64-linux-0.15.1.tar.xz from ziglang.org/download/index.json
  ZIG_SHA256: "c61c5da6edeea14ca51ecd5e4520c6f4189ef5250383db33d01848293bfafe05"

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release

# Zig installation template
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils
  - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
  # S11: Verify download integrity before extraction.
  - echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c
  - tar -xf zig.tar.xz
  - export PATH="$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
  - zig version

# Format check (replaces zig-format component)
zig-format:
  stage: lint
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig fmt --check src/ tests/ build.zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 hour

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# S14: ReleaseFast optimization tests (catches UB that Debug mode masks)
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

# Cross-compilation tests
test-cross-build:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build -Dtarget=x86_64-linux
    - zig build -Dtarget=aarch64-linux
    - zig build -Dtarget=x86_64-macos
    - zig build -Dtarget=aarch64-macos
  needs:
    - build
