---
# GitLab CI/CD Pipeline for timeseries
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    - company

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.43.0

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.43.0

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.43.0

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.43.0

variables:
  ZIG_VERSION: "0.16.0"
  # Redirect Zig's global package cache (normally ~/.cache/zig) into the
  # project directory so the cache: block below can persist it across jobs.
  ZIG_GLOBAL_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/zig"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Cache the extracted Zig toolchain and Zig's global package cache
# (thread_pool/otel deps) across all jobs. Keyed on build.zig.zon so a
# dependency/version bump invalidates it automatically.
cache:
  key:
    files:
      - build.zig.zon
  paths:
    - zig-${ZIG_VERSION}/
    - .cache/zig/

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check

# Shared template for the optimize-mode test matrix below. Reproduces the
# exact commands the former per-mode jobs ran: the Debug entry omits
# -Doptimize= entirely (matching Zig's default), other modes pass it explicitly.
.test-matrix:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - |
      if [ "$ZIG_OPTIMIZE" = "Debug" ]; then
        zig build "$ZIG_BUILD_TARGET" --summary all
      else
        zig build "$ZIG_BUILD_TARGET" -Doptimize="$ZIG_OPTIMIZE" --summary all
      fi
  needs:
    - build

# Unit tests across all optimize modes (was: test, test-release-safe,
# test-release-fast, test-release-small).
test:
  extends: .test-matrix
  parallel:
    matrix:
      - ZIG_BUILD_TARGET: test
        ZIG_OPTIMIZE: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]

# Integration tests across optimize modes (was: test-integration,
# test-integration-release-safe, test-integration-release-fast).
test-integration:
  extends: .test-matrix
  parallel:
    matrix:
      - ZIG_BUILD_TARGET: test-integration
        ZIG_OPTIMIZE: [Debug, ReleaseSafe, ReleaseFast]

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# Benchmark regression detection.
# Results are stored as artifacts for trend analysis.
bench-regression:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build bench -Doptimize=ReleaseFast 2>&1 | tee bench-results.txt
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  needs:
    - build
